        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        :root{
          --bg:#0B0F1A;
          --bg-soft:#0E1422;
          --panel: rgba(255,255,255,0.035);
          --panel-solid:#121A2B;
          --line: rgba(255,255,255,0.09);
          --line-soft: rgba(255,255,255,0.06);
          --text:#E7EAF3;
          --text-dim:#8B93A7;
          --violet:#7C5CFF;
          --cyan:#22D3EE;
          --lime:#34D399;
          --grad: linear-gradient(120deg, var(--violet), var(--cyan));
          --max:1160px;
          --radius: 14px;
        }
        *{box-sizing:border-box; max-width:100%;}
        html{scroll-behavior:smooth; overflow-x:hidden; max-width:100vw;}
        body{
          margin:0; overflow-x:hidden; max-width:100vw;
          background:
            radial-gradient(1100px 600px at 85% -10%, rgba(124,92,255,0.16), transparent 60%),
            radial-gradient(900px 500px at -10% 20%, rgba(34,211,238,0.10), transparent 55%),
            var(--bg);
          color:var(--text);
          font-family:'Inter', sans-serif;
          font-size:16px; line-height:1.6;
          -webkit-font-smoothing:antialiased;
        }
        h1,h2,h3{font-family:'Space Grotesk', sans-serif; font-weight:600; line-height:1.15; margin:0; letter-spacing:-0.01em;}
        h1{font-size:clamp(2.1rem, 5vw, 3.2rem);}
        h2{font-size:clamp(1.6rem, 3.2vw, 2.15rem);}
        a{color:inherit;}
        a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--violet); outline-offset:3px; border-radius:6px;}
        .mono{font-family:'JetBrains Mono', monospace;}
        .wrap{max-width:var(--max); margin:0 auto; padding:0 28px; width:100%;}
        .grid-bg{
          position:fixed; inset:0; z-index:-1; opacity:0.35; pointer-events:none;
          background-image:
            linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
          background-size:44px 44px;
          mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
        }
        .skip-link{
          position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;
          background:var(--bg-soft); color:var(--text); padding:10px 16px; border-radius:8px; z-index:1000;
          font-family:'Inter',sans-serif; font-size:14px; border:1px solid var(--line);
        }
        .skip-link:focus{ left:16px; top:16px; width:auto; height:auto; overflow:visible; }
        button, a.btn{ min-height:44px; }
        .burger-btn{
          width:44px; height:44px; display:none; align-items:center; justify-content:center;
          background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); border-radius:10px;
          cursor:pointer; flex-direction:column; gap:4px;
        }
        .burger-line{ display:block; width:20px; height:2px; background:var(--text); border-radius:2px; transition:transform .2s, opacity .2s; }
        .burger-btn[aria-expanded="true"] .burger-line:nth-child(1){ transform:translateY(6px) rotate(45deg); }
        .burger-btn[aria-expanded="true"] .burger-line:nth-child(2){ opacity:0; }
        .burger-btn[aria-expanded="true"] .burger-line:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }
        .mobile-backdrop{
          position:fixed; inset:0; background:rgba(3,6,14,0.45); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          z-index:39; animation:fadeIn .2s ease;
        }
        @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
        @media (max-width:880px){
          .desktop-nav{display:none !important;}
          .burger-btn{display:flex !important;}
          .hero-grid{grid-template-columns:1fr !important; gap:32px !important;}
          .why-grid{grid-template-columns:1fr !important;}
          .cat-grid{grid-template-columns:1fr !important; min-height:520px;}
          .proof-grid{grid-template-columns:1fr !important; row-gap:0 !important;}
          .proof-cell{border-right:none !important; border-bottom:1px solid var(--line-soft) !important; padding:20px 0 !important;}
          .proof-cell:last-child{border-bottom:none !important;}
          .statline-grid{grid-template-columns:1fr 1fr !important; row-gap:0 !important;}
          .statline-grid > div{border-right:none !important; padding-left:0 !important; padding-bottom:14px !important; min-height:68px;}
          .statline-grid > div:nth-child(2n){padding-left:18px !important; border-left:1px solid var(--line-soft) !important;}
          .foot-grid{grid-template-columns:1fr 1fr !important;}
          .cta-row{flex-direction:column !important; align-items:stretch !important;}
          .cta-full-mobile{width:100% !important; justify-content:center !important;}
        }
        @media (max-width:560px){
          .foot-grid{grid-template-columns:1fr !important;}
          .wrap{padding:0 20px !important;}
          h1{font-size:2.1rem !important;}
          .cta-full-mobile{width:100% !important;}
        }
        @media (min-width:521px) and (max-width:768px){
          .explore-grid{grid-template-columns:repeat(2,1fr) !important;}
        }
        @media (min-width:769px) and (max-width:1024px){
          .explore-grid{grid-template-columns:repeat(3,1fr) !important;}
        }
        @media (min-width:1025px){
          .explore-grid{grid-template-columns:repeat(5,1fr) !important;}
        }
        @media (max-width:520px){
          .explore-grid{grid-template-columns:1fr !important;}
        }
